# One-shot diagnostic: what can GITHUB_TOKEN actually do with releases?
# Run manually, then delete this file together with the probe release
# and tag. The response body is printed verbatim on failure.
name: token-probe
on: workflow_dispatch

permissions:
  contents: write
  checks: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create a probe release with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d '{"tag_name":"probe-token","name":"token probe (delete me)","body":"diagnostic for GITHUB_TOKEN release permissions"}')
          echo "HTTP $code"
          cat /tmp/resp.json
          if [ "$code" = "201" ]; then
            echo "CREATE OK — upload test:"
            code2=$(curl -s -o /tmp/resp2.json -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary 'probe content' \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$(jq -r .id /tmp/resp.json)/assets?name=probe.txt")
            echo "UPLOAD HTTP $code2"
            cat /tmp/resp2.json
          fi
