# Full local gate (PROJECT.md §11.4) on every push/PR to main. No deploy
# jobs: deployment is a manual deploy.sh / deploy.bat run on the target
# machine, per the release-mirror spec.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Full test gate
        run: ./scripts/test.sh
