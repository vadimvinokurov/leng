# Client releases on v* tags. Publishes immediately (not a draft):
# releases/latest/download/latest.json must resolve the moment the tag
# lands. The server mirrors the release of its own version, so this
# workflow is the only place client binaries are ever built.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must equal version in tauri.conf.json and both crates
        run: |
          conf=$(python3 -c "import json; print(json.load(open('client/src-tauri/tauri.conf.json'))['version'])")
          tauri_crate=$(grep -m1 '^version = ' client/src-tauri/Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')
          core_crate=$(grep -m1 '^version = ' client/core/Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')
          # The version protocol uses bare semver everywhere; compare
          # without the leading "v". All three sources must line up — the
          # GUI version header ships from the crate, the updater manifest
          # from tauri.conf.json, the server gates on the exact tag.
          tag="${GITHUB_REF_NAME#v}"
          failed=0
          for pair in "tauri.conf.json|$conf" "src-tauri crate|$tauri_crate" "core crate|$core_crate"; do
            name="${pair%%|*}"; value="${pair##*|}"
            if [ "$tag" != "$value" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match ${name} version ${value}"
              failed=1
            fi
          done
          exit $failed

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The signing identity is a stable self-signed "Leng Developer"
      # certificate: ad-hoc linker signing produces a fresh identity per
      # build, and TCC ties permissions to it, so every update dropped the
      # Accessibility grant (the 2026-11-06 incident). The cert lives in
      # repo secrets; the identity name is fixed in tauri.conf.json.
      - name: Install the macOS signing identity
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_B64: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: random-trust-no-one
        run: |
          echo "$MACOS_CERT_B64" | base64 --decode > /tmp/leng-signing.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" leng-signing.keychain
          security list-keychains -d user -s "$(security list-keychains -d user | tr -d '"')" leng-signing.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" leng-signing.keychain
          security import /tmp/leng-signing.p12 -k leng-signing.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" leng-signing.keychain
          rm -f /tmp/leng-signing.p12
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      # tauri-action's own create-release call 403s on this repo
      # ("Resource not accessible by integration"), while the same
      # token creating the release through `gh` in the same tag
      # context succeeds (probed 2026-11-06). Pre-create here; the
      # action then finds the release and uploads its assets.
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" \
            || gh release create "${{ github.ref_name }}" \
                 --title "${{ github.ref_name }}" --notes ""
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri_args }}
