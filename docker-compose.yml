# docker compose v2: no top-level version field.
# Backend (always) and fake-llm test server (--profile test).
# LENG_PORT / LENG_DATA_DIR come from the .env file and are only used
# for compose interpolation below, not inside the containers.
# LENG_VERSION comes from the deploy script's shell (release tag or
# "dev") and is passed through into the backend container.
services:
  backend:
    build: .
    env_file: .env
    environment:
      # The DB always lives on the mounted volume inside the container.
      LENG_DB_PATH: /data/leng.db
      # Server version (release tag without the "v", or "dev"); set by
      # deploy.sh / deploy.bat through the shell, default dev.
      LENG_VERSION: ${LENG_VERSION:-dev}
    ports:
      - "${LENG_PORT:-28080}:8000"
    volumes:
      - "${LENG_DATA_DIR:-./data}:/data"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  fake-llm:
    profiles:
      - test
    image: python:3.12-slim
    command: python3 /app/fake_llm_server.py /fixtures
    volumes:
      - ./backend/tests/e2e/fake_llm_server.py:/app/fake_llm_server.py:ro
      - ./backend/tests/fixtures/llm:/fixtures:ro
