[package]
name = "leng"
version = "0.1.5"
description = "Leng desktop client: HUD window, tray, eventTap-triggered capture"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"

leng-core = { path = "../core" }

# Standalone crate: no parent workspace exists yet.
[workspace]
