<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Leng — требуется разрешение</title>
  <style>
    :root {
      --surface: #f5f5f7;
      --text: #1d1d1f;
      --text-muted: #55555a;
      --accent: #6d5ae6;
      --accent-text: #ffffff;
      --border: #d6d6da;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      background: var(--surface);
      padding: 16px 20px;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
    }

    .permission__actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      font: inherit;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      min-height: 32px;
    }

    button#open-settings {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
    }

    button#recheck {
      margin-left: auto;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>
  <h1>Leng</h1>
  <p>
    Разрешите приложению Leng доступ в System Settings → Privacy →
    Accessibility, чтобы двойное нажатие ⌘C открывало перевод.
  </p>
  <div class="permission__actions">
    <button id="open-settings" type="button">Открыть настройки</button>
    <button id="recheck" type="button">Проверить снова</button>
  </div>

  <script>
    const tauri = window.__TAURI__;
    document.getElementById("open-settings").addEventListener("click", () => {
      tauri.core.invoke("open_accessibility_settings");
    });
    const recheckButton = document.getElementById("recheck");
    recheckButton.addEventListener("click", async () => {
      recheckButton.disabled = true;
      try {
        const granted = await tauri.core.invoke("check_permission");
        if (granted) {
          await tauri.window.getCurrentWindow().close();
        }
      } finally {
        recheckButton.disabled = false;
      }
    });
  </script>
</body>
</html>
