<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Leng — Настройки</title>
  <style>
    :root {
      --surface: #f5f5f7;
      --field: #ffffff;
      --text: #1d1d1f;
      --text-muted: #6e6e73;
      --accent: #007aff;
      --accent-text: #ffffff;
      --focus-ring: rgba(0, 122, 255, 0.3);
      --border: rgba(0, 0, 0, 0.12);
      --button: rgba(118, 118, 128, 0.12);
      --error: #d70015;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1c1c1e;
        --field: #2c2c2e;
        --text: #f2f2f4;
        --text-muted: #98989f;
        --accent: #0a84ff;
        --focus-ring: rgba(10, 132, 255, 0.35);
        --border: rgba(255, 255, 255, 0.12);
        --button: rgba(118, 118, 128, 0.24);
        --error: #ff453a;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      background: var(--surface);
      padding: 16px 20px;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
    }

    fieldset {
      border: none;
      padding: 0;
    }

    label {
      display: block;
      margin: 12px 0 4px;
      color: var(--text-muted);
      font-size: 12px;
    }

    input {
      font: inherit;
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
      min-height: 32px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .error {
      color: var(--error);
      min-height: 20px;
      margin-top: 8px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      font: inherit;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      min-height: 32px;
    }

    button#save {
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
      margin-left: auto;
    }

    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>
  <h1>Настройки</h1>
  <p>Сервер и его изменения применяются сразу, без перезапуска.</p>
  <fieldset>
    <legend hidden>Backend</legend>
    <label for="backend-url">Адрес сервера</label>
    <input id="backend-url" type="text" placeholder="http://localhost:28080" autocomplete="off" />
    <label for="api-token">API-ключ</label>
    <input id="api-token" type="password" autocomplete="off" spellcheck="false" />
  </fieldset>
  <div class="error" id="error"></div>
  <div class="actions">
    <button id="cancel" type="button">Отмена</button>
    <button id="save" type="button">Сохранить</button>
  </div>

  <script>
    const tauri = window.__TAURI__;
    const url = document.getElementById("backend-url");
    const token = document.getElementById("api-token");
    const saveButton = document.getElementById("save");
    const errorLine = document.getElementById("error");

    (async () => {
      try {
        const settings = await tauri.core.invoke("get_backend_settings");
        if (settings.base_url !== null) url.value = settings.base_url;
        if (settings.api_token !== null) token.value = settings.api_token;
      } catch (err) {
        errorLine.textContent = "не удалось прочитать настройки: " + err;
      }
    })();

    document.getElementById("cancel").addEventListener("click", () => {
      tauri.window.getCurrentWindow().close();
    });

    saveButton.addEventListener("click", async () => {
      errorLine.textContent = "";
      saveButton.disabled = true;
      try {
        await tauri.core.invoke("save_backend_settings", {
          baseUrl: url.value,
          apiToken: token.value,
        });
        await tauri.window.getCurrentWindow().close();
      } catch (err) {
        errorLine.textContent = String(err);
      } finally {
        saveButton.disabled = false;
      }
    });
  </script>
</body>
</html>
